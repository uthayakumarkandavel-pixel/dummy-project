<app-recipes-card>
    <ng-content header>{{ title }}</ng-content>
    <ng-content>
        @for (ingredient of ingredients; track $index) {
            <div
                (click)="ingredientSelectHandler(ingredient)"
                [ngClass]="{
                    'bg-orange-200 border-orange-400': isSelected(ingredient),
                    'bg-orange-50 border-orange-200': !isSelected(ingredient)
                }"
                class="flex items-center gap-3 cursor-pointer border rounded-xl px-4 py-3 hover:border-orange-400 hover:bg-orange-100 transition"
            >
                <i class="pi pi-check-circle text-orange-600"></i>
                <span class="text-gray-700">
                    {{ ingredient }}
                </span>
            </div>
        }
    </ng-content>
</app-recipes-card>
