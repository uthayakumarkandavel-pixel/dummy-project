<div>
    <h2 class="text-3xl font-bold text-orange-600 flex items-center gap-3 mb-6">
        <i class="pi pi-shopping-basket"></i>
        Ingredients
    </h2>
    <div class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
        @for (ingredient of ingredients; track ingredient) {
        <div
            class="flex items-center gap-3 bg-orange-50 border border-orange-100 rounded-xl px-4 py-3 hover:bg-orange-100 transition">
            <i class="pi pi-check-circle text-orange-600"></i>
            <span class="text-gray-700">
                {{ ingredient }}
            </span>
        </div>
        }
    </div>
</div>
