<div class="min-h-screen bg-gradient-to-br from-yellow-100 via-orange-50 to-red-100">
    <app-header [selectedIngredients]="selectedIngredients()" [selectedDeliveryType]="selectedDeliveryType()"
        (closeChip)="handleCloseChip($event)" (reset)="resetFilters()">
    </app-header>
    @if(loader()) {
    <app-loader></app-loader>
    }
    @else {
    <div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-xl border border-orange-100 p-8">
        <app-breadcrumbs
            [breadcrumbsItem]="[{name:'Recipes',link:'/recipe'},{name:recipe()?.name||'' }]"></app-breadcrumbs>
        <h1 class="text-4xl font-bold text-center text-orange-700 mb-8">
            {{ recipe()?.name }}
        </h1>
        <div class="flex flex-wrap justify-center gap-4 mb-10">
            <div class="flex items-center gap-2 bg-orange-50 border border-orange-200 rounded-full px-5 py-2 shadow-sm">
                <i class="pi pi-star-fill text-yellow-500"></i>
                <span>{{ recipe()?.rating }}</span>
            </div>
            <div class="flex items-center gap-2 bg-orange-50 border border-orange-200 rounded-full px-5 py-2 shadow-sm">
                <i class="pi pi-clock text-orange-600"></i>
                <span>{{ recipe()?.prepTimeMinutes }} mins Prep</span>
            </div>
            <div class="flex items-center gap-2 bg-orange-50 border border-orange-200 rounded-full px-5 py-2 shadow-sm">
                <i class="pi pi-stopwatch text-orange-600"></i>
                <span>{{ recipe()?.cookTimeMinutes }} mins Cook</span>
            </div>
            <div class="flex items-center gap-2 bg-orange-50 border border-orange-200 rounded-full px-5 py-2 shadow-sm">
                <i class="pi pi-users text-orange-600"></i>
                <span>{{ recipe()?.servings }} Servings</span>
            </div>
        </div>
        <div class="grid md:grid-cols-2 gap-12 items-start">
            <div class="flex justify-center flex-col items-center mt-2">
                <img [src]="recipe()?.image" [alt]="recipe()?.name"
                    class=" max-w-md aspect-square object-cover rounded-3xl shadow-lg border-4 border-orange-100 transition-transform duration-300 hover:scale-105">
                <div class="flex justify-center mt-5">
                    <span
                        class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-orange-50 border border-orange-200 text-orange-600 font-semibold shadow-sm">
                        <i class="pi pi-globe"></i>
                        {{ recipe()?.cuisine }} Cuisine
                    </span>
                </div>
            </div>
            <div class="mb-10 p-6 rounded-3xl bg-gradient-to-r from-orange-50 to-amber-50 border border-orange-200">
                <app-ingredient [ingredients]="recipe()?.ingredients ?? []">
                </app-ingredient>
            </div>
        </div>
        <app-delivery-type />

        <div class="my-10 p-6 rounded-3xl bg-gradient-to-r from-orange-50 to-amber-50 border border-orange-200">
            <app-instruction [instructions]="recipe()?.instructions??[]"></app-instruction>
        </div>
    </div>
    }
</div>
