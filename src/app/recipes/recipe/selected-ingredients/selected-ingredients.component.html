@if(selectedIngredients()?.length){
    <section class=" mt-3 my-10 p-6 rounded-3xl bg-gradient-to-r from-orange-50 to-amber-50 border border-orange-200">
        <h2 class="text-3xl font-bold text-orange-600 flex items-center gap-3 mb-6">
            <i class="pi pi-shopping-cart text-orange-600"></i>
            Selected Ingredients
        </h2>
        <div class="flex flex-wrap gap-3">
            @for(ingredient of selectedIngredients(); track ingredient){
                <span class="rounded-full bg-orange-100 px-4 py-2 font-medium text-orange-700">
                    {{ ingredient }}
                </span>
            }
        </div>
    </section>
}
