<app-recipes-card>
    <ng-content header><i class="pi pi-list-check"></i>
        {{title}}
    </ng-content>
    <ng-content>
        @for(step of instructions; track step; let i = $index){
        <div class="flex gap-4 bg-orange-100 border border-orange-200 rounded-xl p-4 hover:bg-orange-200 transition">
            <div
                class="w-10 h-10 rounded-full bg-orange-600 text-white flex items-center justify-center font-semibold shrink-0">
                {{ i + 1 }}
            </div>
            <p class="text-gray-700 leading-7">
                {{ step }}
            </p>
        </div>
        }
    </ng-content>
</app-recipes-card>
